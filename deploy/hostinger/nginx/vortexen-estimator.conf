# ==============================================================================
# Vortexen Estimator — Host Nginx VirtualHost (Co-hosted on Hostinger KVM 2)
# Install at: /etc/nginx/sites-available/vortexen-estimator
# Symlink to: /etc/nginx/sites-enabled/vortexen-estimator
#
# Co-hosting isolation:
#   - Uses unique limit_req_zone names (vx_auth_login_limit, vx_auth_refresh_limit)
#     so they NEVER collide with Market Intel DB zones (mi_auth_limit, etc.).
#   - Proxies exclusively to 127.0.0.1:8100 (API) and 127.0.0.1:3100 (Web),
#     leaving 127.0.0.1:8000 and 127.0.0.1:5432 untouched for Market Intel DB.
#   - Scopes client_max_body_size 1024M strictly to this server block.
# ==============================================================================

limit_req_zone $binary_remote_addr zone=vx_auth_login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vx_auth_refresh_limit:10m rate=30r/m;

upstream vortexen_api_upstream {
    server 127.0.0.1:8100;
    keepalive 16;
}

upstream vortexen_web_upstream {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name estimator.vortexen.com;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name estimator.vortexen.com;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/estimator.vortexen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estimator.vortexen.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:VortexenSSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Allow large PlanSwift .SwiftJob.zip / IFC archives up to 1 GiB (scoped only to Vortexen)
    client_max_body_size 1024M;
    client_body_timeout 300s;
    send_timeout 300s;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/vortexen-estimator.access.log;
    error_log /var/log/nginx/vortexen-estimator.error.log warn;

    # Block API documentation and OpenAPI schema in production
    location ~ ^/api/(docs|schema)(/|$) {
        return 403;
    }

    # Auth endpoints with dedicated rate limits
    location = /api/v1/auth/login/ {
        limit_req zone=vx_auth_login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://vortexen_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/v1/auth/refresh/ {
        limit_req zone=vx_auth_refresh_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://vortexen_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django static files collected to host directory
    location /static/ {
        alias /opt/vortexen-estimator/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Django API & Admin (supports streaming uploads up to 1024M)
    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://vortexen_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Next.js immutable build assets
    location /_next/static/ {
        proxy_pass http://vortexen_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Next.js application routes
    location / {
        proxy_pass http://vortexen_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
