[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vortexen-extraction-engine"
version = "2.0.0"
description = "100% Standalone PlanSwift ZIP Extraction, Geometry, Formula & Calculation Engine (Zero PlanSwift / Zero COM / Zero OCR)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "lxml>=5.3.0",
    "openpyxl>=3.1.5",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["extraction_engine*"]
